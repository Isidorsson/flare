[package]
name = "flare"
version = "0.1.0"
description = "Desktop shell for Claude Code"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "flare_lib"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-shell = "=2.4.0"
serde_json = "=1.0.151"
serde = "=1.0.229"
