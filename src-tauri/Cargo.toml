[package]
name = "flare"
version = "0.1.0"
description = "Desktop shell for Claude Code"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "flare_lib"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
ignore = "=0.4.33"
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tree-sitter = "=0.26.13"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"

[dev-dependencies]
tempfile = "=3.27.0"
